name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 1. Build et push les images sur GHCR ─────────────────────────────────
  build-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur ghcr.io
    outputs:
      app_image:   ${{ steps.vars.outputs.app_image }}
      nginx_image: ${{ steps.vars.outputs.nginx_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Calcul des noms d'images
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "app_image=ghcr.io/${OWNER}/saaheem-app:latest"   >> $GITHUB_OUTPUT
          echo "nginx_image=ghcr.io/${OWNER}/saaheem-nginx:latest" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push — app (PHP-FPM)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.vars.outputs.app_image }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push — nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: true
          tags: ${{ steps.vars.outputs.nginx_image }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 2. Déploiement sur le VPS Hostinger ──────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copie docker-compose.prod.yml sur le VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || '22' }}
          source:   docker-compose.prod.yml
          target:   /opt/saaheem/

      - name: Pull & restart sur le VPS
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE:   ${{ needs.build-push.outputs.app_image }}
          NGINX_IMAGE: ${{ needs.build-push.outputs.nginx_image }}
          APP_KEY:     ${{ secrets.APP_KEY }}
          APP_URL:     ${{ vars.APP_URL }}
          GH_ACTOR:    ${{ github.actor }}
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || '22' }}
          envs:     APP_IMAGE,NGINX_IMAGE,APP_KEY,APP_URL,GH_ACTOR,GH_TOKEN
          script: |
            set -e

            # Authentification GHCR depuis le VPS
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            # Pull des nouvelles images
            docker pull "$APP_IMAGE"
            docker pull "$NGINX_IMAGE"

            cd /opt/saaheem

            # Restart — les variables d'env viennent directement de GitHub Secrets/Variables
            APP_IMAGE="$APP_IMAGE" \
            NGINX_IMAGE="$NGINX_IMAGE" \
            APP_KEY="$APP_KEY" \
            APP_URL="$APP_URL" \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Suppression des images obsolètes
            docker image prune -f

name: Deploy Saaheem

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app (PHP-FPM)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/saaheem-app:latest
          cache-from: type=gha,scope=saaheem-app
          cache-to: type=gha,mode=max,scope=saaheem-app

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/saaheem-nginx:latest
          cache-from: type=gha,scope=saaheem-nginx
          cache-to: type=gha,mode=max,scope=saaheem-nginx

  deploy:
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: saaheem
          docker-compose-path: docker-compose.prod.yml
          environment-variables: |
            APP_IMAGE=ghcr.io/${{ github.repository_owner }}/saaheem-app:latest
            NGINX_IMAGE=ghcr.io/${{ github.repository_owner }}/saaheem-nginx:latest
            APP_KEY=${{ secrets.APP_KEY }}
            APP_URL=${{ vars.APP_URL }}
            HTTP_PORT=${{ vars.HTTP_PORT }}
name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 1. Build et push les images sur GHCR ─────────────────────────────────
  build-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser sur ghcr.io
    outputs:
      app_image:   ${{ steps.vars.outputs.app_image }}
      nginx_image: ${{ steps.vars.outputs.nginx_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Calcul des noms d'images
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "app_image=ghcr.io/${OWNER}/saaheem-app:latest"   >> $GITHUB_OUTPUT
          echo "nginx_image=ghcr.io/${OWNER}/saaheem-nginx:latest" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push — app (PHP-FPM)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.vars.outputs.app_image }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push — nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          target: nginx
          push: true
          tags: ${{ steps.vars.outputs.nginx_image }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── 2. Déploiement sur le VPS Hostinger ──────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: chessapt
          docker-compose-path: docker-compose.prod.yml
          environment-variables: |
            APP_ENV=production
            APP_DEBUG=false
            APP_KEY=${{ secrets.APP_KEY }}
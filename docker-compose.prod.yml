services:
  app:
    image: ghcr.io/beamerboy14/saaheem-app:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_NAME: SAAHEEM
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: ${MAIL_MAILER}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      CONTACT_EMAIL: ${CONTACT_EMAIL}
    volumes:
      - media_photos:/var/www/html/public/photos
      - media_videos:/var/www/html/public/videos
      - app_storage:/var/www/html/storage
    networks:
      - backend

  nginx:
    image: ghcr.io/beamerboy14/saaheem-nginx:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saaheem.rule=Host(`saaheem.com`) || Host(`www.saaheem.com`)"
      - "traefik.http.routers.saaheem.entrypoints=websecure"
      - "traefik.http.routers.saaheem.tls.certresolver=letsencrypt"
      - "traefik.http.services.saaheem.loadbalancer.server.port=80"
    volumes:
      - media_photos:/var/www/html/public/photos:ro
      - media_videos:/var/www/html/public/videos:ro
    depends_on:
      - app
    networks:
      - backend

volumes:
  media_photos:
  media_videos:
  app_storage:

networks:
  backend:
# Fichier utilisé par le VPS — les images viennent de GHCR, pas d'un build local.
# Variables attendues au lancement : APP_IMAGE, NGINX_IMAGE (injectées par le workflow CI)
# Variables Laravel : fichier .env dans /opt/saaheem/.env

services:

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    environment:
      APP_NAME: SAAHEEM
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - media_photos:/var/www/html/public/photos
      - media_videos:/var/www/html/public/videos
      - app_storage:/var/www/html/storage
    networks:
      - backend

  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - media_photos:/var/www/html/public/photos:ro
      - media_videos:/var/www/html/public/videos:ro
    depends_on:
      - app
    networks:
      - backend

volumes:
  media_photos:
  media_videos:
  app_storage:

networks:
  backend:

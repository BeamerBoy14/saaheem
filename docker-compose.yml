services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    environment:
      APP_NAME: "SAAHEEM"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-https://saaheem.com}"
      APP_KEY: "${APP_KEY}"
      LOG_CHANNEL: stderr
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      # Médias persistants entre déploiements
      - media_photos:/var/www/html/public/photos
      - media_videos:/var/www/html/public/videos
      # Storage Laravel (sessions, cache fichier, logs)
      - app_storage:/var/www/html/storage
    networks:
      - backend

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      # Nginx sert les médias directement depuis les mêmes volumes
      - media_photos:/var/www/html/public/photos:ro
      - media_videos:/var/www/html/public/videos:ro
    depends_on:
      - app
    networks:
      - backend

volumes:
  media_photos:
  media_videos:
  app_storage:

networks:
  backend:
